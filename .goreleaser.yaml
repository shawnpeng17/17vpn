# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: 17vpn

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    main: ./main.go
    binary: 17vpn
    ldflags:
      - -s -w
      - -X github.com/shawnpeng17/17vpn/cmd.version={{.Version}}
      - -X github.com/shawnpeng17/17vpn/cmd.commit={{.Commit}}
      - -X github.com/shawnpeng17/17vpn/cmd.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
